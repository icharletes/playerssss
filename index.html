<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Audio Player</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="audio-player">
    <div class="player-top">
        <input
            type="range"
            id="progress"
            class="progress"
            value="0"
            min="0"
            step="0.1"
        />
        <span class="time" id="time">00:00</span>
    </div>

    <div class="player-bottom">
        <button class="volume-btn" id="volumeBtn" aria-label="Volumen">
            <img src="img/vol.svg" alt="Volumen">
        </button>

        <button class="play-btn" id="playBtn" aria-label="Play">
            <img src="img/play.svg" alt="Play">
        </button>
    </div>

    <!-- Audio -->
    <audio id="audio" src="europe-endless.mp3"></audio>
</div>

<script src="js/main.js" defer></script>
</body>
</html>
